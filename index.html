  },
  manage(){
    const m=Modal.open(`<div class="mhead"><div><span class="eyebrow">Competition areas</span>
        <h3 style="margin-top:7px">Track and field areas</h3></div><div class="spacer"></div>
        <button class="btn btn-icon" data-x="close">✕</button></div>
      <div class="mbody">${Store.state.arenas.map(a=>`
        <div class="srow" style="grid-template-columns:1fr auto auto">
          <div><div class="ev">${esc(a.name)}</div><div class="cg">${a.type}</div></div>
          <span class="arena-tag ${a.type}">${a.type}</span>
          <button class="btn btn-xs btn-danger" data-del="${a.id}" ${Store.state.arenas.length<2?'disabled':''}>Remove</button>
        </div>`).join('')}</div>
      <div class="mfoot"><button class="btn" data-x="new">${ICON.plus}Add area</button><div class="spacer"></div>
        <button class="btn btn-primary" data-x="close">Done</button></div>`);
    $$('[data-del]',m).forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.del, used=Store.comps().filter(c=>c.arenaId===id).length;
      confirmDo("Remove this area?", used?`${used} competition(s) are assigned to it and will move to ${Store.state.arenas.find(a=>a.id!==id).name}.`:"It has no competitions assigned.","Remove",
        ()=>{ const fallback=Store.state.arenas.find(a=>a.id!==id);
          Store.comps().forEach(c=>{ if(c.arenaId===id){ c.arenaId=fallback.id; c.type=fallback.type; } });
          Store.state.arenas=Store.state.arenas.filter(a=>a.id!==id); Store.save(); Modal.close(); Dashboard.render(); });
    }));
    $$('[data-x]',m).forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.x==="new") Arenas.add(()=>Arenas.manage()); else { Modal.close(); Dashboard.render(); }
    }));
  }
};

/* ============================================================
   6b. SCHEDULE EDITOR — reorder and run the programme live
   ============================================================ */
const ScheduleEditor = {
  filter:"all", open_:false,
  open(){ this.open_=true; this.paint(); },
  refresh(){ if(this.open_ && $('#schedBody')) this.paintBody(); },
  paint(){
    const m=Modal.open(`
      <div class="mhead"><div><span class="eyebrow">Programme</span>
        <h3 style="margin-top:7px">Schedule &amp; timing</h3></div><div class="spacer"></div>
        <button class="btn" data-x="areas">Areas</button>
        <button class="btn" data-x="bulk">${ICON.plus}From programme</button>
        <button class="btn btn-primary" data-x="add">${ICON.plus}Add competition</button>
        <button class="btn btn-icon" data-x="close">✕</button></div>
      <div class="sfilters" id="sFilters">
        <button class="seg" data-f="all" aria-pressed="${this.filter==='all'}">All</button>
        ${Store.state.arenas.map(a=>`<button class="seg ${a.type==='field'?'gold':''}" data-f="${a.id}" aria-pressed="${this.filter===a.id}">${esc(a.name)}</button>`).join('')}
        <button class="seg" data-f="today" aria-pressed="${this.filter==='today'}">Not finished</button>
      </div>
      <div class="mbody" id="schedBody"></div>
      <div class="mfoot"><span class="hint" style="font-size:11px;color:var(--ink-3)">Drag the handle to reorder · times are whatever you enter, nothing is generated</span>
        <div class="spacer"></div><button class="btn btn-primary" data-x="close">Done</button></div>`,"wide");
    $$('#sFilters .seg',m).forEach(b=>b.addEventListener('click',()=>{ this.filter=b.dataset.f;
      $$('#sFilters .seg',m).forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===this.filter)); this.paintBody(); }));
    $$('[data-x]',m).forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.x;
      if(a==="close"){ this.open_=false; Modal.close(); Dashboard.render(); }
      if(a==="add"){ this.open_=false; CompForm.open(null); }
      if(a==="bulk") this.bulk();
      if(a==="areas"){ this.open_=false; Arenas.manage(); }
    }));
    this.paintBody();
  },
  list(){
    let l=Store.ordered();
    if(this.filter==="today") l=l.filter(c=>!["completed","cancelled"].includes(c.status));
    else if(this.filter!=="all") l=l.filter(c=>c.arenaId===this.filter);
    return l;
  },
  paintBody(){
    const body=$('#schedBody'); if(!body) return;
    const l=this.list();
    if(!l.length){ body.innerHTML=`<div class="empty-state" style="padding:30px 0">
      <div class="big">Nothing in the programme yet</div>
      <p>Add competitions one by one, or pull a whole age group in from the official programme and set the times you need.</p></div>`; return; }
    body.innerHTML=l.map(c=>{
      const a=Store.arena(c.arenaId), acts=[];
      if(["scheduled","ready","delayed"].includes(c.status)) acts.push(`<button class="btn btn-xs btn-gold" data-a="start" data-id="${c.id}">Start</button>`);
      if(c.status==="scheduled") acts.push(`<button class="btn btn-xs" data-a="ready" data-id="${c.id}">Ready</button>`);
      if(c.status==="live") acts.push(`<button class="btn btn-xs" data-a="pause" data-id="${c.id}">Pause</button>`,
                                      `<button class="btn btn-xs" data-a="complete" data-id="${c.id}">Complete</button>`);
      if(c.status==="paused") acts.push(`<button class="btn btn-xs btn-primary" data-a="resume" data-id="${c.id}">Resume</button>`,
                                        `<button class="btn btn-xs" data-a="complete" data-id="${c.id}">Complete</button>`);
      if(["live","paused","completed"].includes(c.status)) acts.push(`<button class="btn btn-xs btn-gold" data-a="result" data-id="${c.id}">${c.resultId?'Result ✓':'Result'}</button>`);
      if(c.status==="cancelled") acts.push(`<button class="btn btn-xs" data-a="restore" data-id="${c.id}">Restore</button>`);
      acts.push(`<button class="btn btn-xs" data-a="edit" data-id="${c.id}">Edit</button>`);
      return `<div class="srow" draggable="true" data-row="${c.id}">
        <div class="grip" title="Drag to reorder">⠿</div>
        <div class="tm">${c.scheduledStart?fmtClock(c.scheduledStart):'<span class="muted">—</span>'}
          <small>${c.duration?c.duration+' min':(Comp.expectedEnd(c)?'ends '+fmtClock(Comp.expectedEnd(c)):'no duration')}</small></div>
        <div><div class="ev">${esc(Comp.title(c))}</div>
          <div class="cg">${esc(c.category)} · ${esc(c.gender)}${c.location?' · '+esc(c.location):''}${c.note?' · '+esc(c.note):''}</div></div>
        <div><span class="arena-tag ${a.type}">${esc(a.name)}</span></div>
        <div><span class="chip s-${c.status}">${STATUS_LABEL[c.status]}</span></div>
        <div class="acts">${acts.join('')}
          <button class="btn btn-xs" data-a="up" data-id="${c.id}" title="Move earlier">↑</button>
          <button class="btn btn-xs" data-a="down" data-id="${c.id}" title="Move later">↓</button></div>
      </div>`;
    }).join('');

    $$('[data-a]',body).forEach(b=>b.addEventListener('click',()=>{
      const c=Store.comp(b.dataset.id), a=b.dataset.a;
      if(a==="start"){ Comp.start(c); toast("Started.","ok",1800); }
      if(a==="ready") Comp.setStatus(c,"ready");
      if(a==="pause") Comp.pause(c);
      if(a==="resume") Comp.resume(c);
      if(a==="restore") Comp.setStatus(c,"scheduled");
      if(a==="complete"){ Comp.complete(c); toast("Marked completed.","ok",1800); }
      if(a==="edit"){ this.open_=false; return CompForm.open(c.id); }
      if(a==="result"){ this.open_=false; return ResultEntry.open(c.id); }
      if(a==="up") Store.move(c.id,-1);
      if(a==="down") Store.move(c.id,1);
      this.paintBody(); Dashboard.render();
    }));
    let dragId=null;
    $$('.srow',body).forEach(r=>{
      r.addEventListener('dragstart',()=>{ dragId=r.dataset.row; r.classList.add('dragging'); });
      r.addEventListener('dragend',()=>{ r.classList.remove('dragging'); $$('.srow',body).forEach(x=>x.classList.remove('over')); });
      r.addEventListener('dragover',e=>{ e.preventDefault(); r.classList.add('over'); });
      r.addEventListener('dragleave',()=>r.classList.remove('over'));
      r.addEventListener('drop',e=>{ e.preventDefault();
        if(dragId&&dragId!==r.dataset.row){ Store.reorder(dragId,r.dataset.row); this.paintBody(); Dashboard.render(); } });
    });
  },
  bulk(){
    const st={cat:CATS[1],gen:"Boys",arena:Store.state.arenas[0].id,picked:new Set()};
    const draw=()=>{
      const m=Modal.open(`
        <div class="mhead"><div><span class="eyebrow">Official programme</span>
          <h3 style="margin-top:7px">Add events to the schedule</h3></div><div class="spacer"></div>
          <button class="btn btn-icon" data-x="close">✕</button></div>
        <div class="mbody">
          <div class="formsec"><div class="grid3">
            <div class="field"><label>Category</label><select class="inp" id="bCat">${CATS.map(c=>`<option ${c===st.cat?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="field"><label>Gender</label><select class="inp" id="bGen">${GENDERS.map(g=>`<option ${g===st.gen?'selected':''}>${g}</option>`).join('')}</select></div>
            <div class="field"><label>Area</label><select class="inp" id="bArena">${Store.state.arenas.map(a=>`<option value="${a.id}" ${a.id===st.arena?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
          </div></div>
          <div class="segs" style="margin-bottom:10px">
            <button class="seg" data-pick="track">Select all track events</button>
            <button class="seg gold" data-pick="field">Select all field events</button>
            <button class="seg" data-pick="none">Clear</button>
          </div>
          ${PROGRAMME[st.cat][st.gen].map(e=>`
            <div class="srow" style="grid-template-columns:auto 1fr auto" data-ev="${esc(e)}">
              <input type="checkbox" ${st.picked.has(e)?'checked':''} style="width:17px;height:17px;accent-color:var(--navy-2)">
              <div class="ev">${esc(e)}</div>
              <span class="arena-tag ${isFieldEvent(e)?'field':'track'}">${isFieldEvent(e)?'Field':'Track'}</span>
            </div>`).join('')}
          <p style="font-size:11.5px;color:var(--ink-3);line-height:1.5;margin:10px 0 0">
            Added competitions start with no time set. Open each one to enter its real start time, or start it directly when the athletes are on the line.</p>
        </div>
        <div class="mfoot"><div class="spacer"></div>
          <button class="btn" data-x="back">Back</button>
          <button class="btn btn-primary" data-x="addsel">Add selected</button></div>`,"");
      const sync=()=>{ st.cat=$('#bCat').value; st.gen=$('#bGen').value; st.arena=$('#bArena').value; st.picked=new Set(); };
      ['#bCat','#bGen'].forEach(s=>$(s).addEventListener('change',()=>{ sync(); draw(); }));
      $('#bArena').addEventListener('change',()=>{ st.arena=$('#bArena').value; });
      $$('[data-ev]',m).forEach(r=>{ const cb=$('input',r);
        r.addEventListener('click',e=>{ if(e.target!==cb) cb.checked=!cb.checked;
          cb.checked?st.picked.add(r.dataset.ev):st.picked.delete(r.dataset.ev); }); });
      $$('[data-pick]',m).forEach(b=>b.addEventListener('click',()=>{
        const k=b.dataset.pick;
        $$('[data-ev]',m).forEach(r=>{ const e=r.dataset.ev, want = k==="none"?false : k==="field"?isFieldEvent(e):!isFieldEvent(e);
          $('input',r).checked=want; want?st.picked.add(e):st.picked.delete(e); }); }));
      $$('[data-x]',m).forEach(b=>b.addEventListener('click',()=>{
        if(b.dataset.x==="close"){ this.open_=false; Modal.close(); Dashboard.render(); return; }
        if(b.dataset.x==="back") return this.paint();
        if(!st.picked.size){ toast("Tick at least one event.","warn"); return; }
        [...st.picked].forEach(e=>{
          const c=Comp.blank(st.arena); c.category=st.cat; c.gender=st.gen; c.event=e;
          Store.addComp(c);
        });
        toast(`${st.picked.size} competition${st.picked.size>1?'s':''} added — set their times when you know them.`,"ok",4200);
        this.paint(); Dashboard.render();
      }));
    };
    draw();
  }
};

/* ============================================================
   7. SCORING SETTINGS — points are set by staff, never assumed
   ============================================================ */
const Scoring = {
  open(){
    const s=JSON.parse(JSON.stringify(Store.state.scoring));
    const m=Modal.open(`
      <div class="mhead"><div><span class="eyebrow">Official scoring</span>
        <h3 style="margin-top:7px">Points per placing</h3></div><div class="spacer"></div>
        <button class="btn btn-icon" data-x="close">✕</button></div>
      <div class="mbody">
        <p style="font-size:13px;color:var(--ink-2);line-height:1.6;margin:0 0 14px">
          Enter the points your meet awards. House standings are built only from published results using these values,
          and each result can still be adjusted individually.</p>
        <div class="formsec"><span class="eyebrow">Individual events</span>
          <div class="grid3">
            ${[1,2,3].map(n=>`<div class="field"><label>${ORDTXT(n)} place</label>
              <input class="inp" type="number" min="0" id="i${n}" value="${s.individual[n]||''}" placeholder="0"></div>`).join('')}
          </div></div>
        <div class="formsec"><span class="eyebrow">Relay events</span>
          <div class="grid3">
            ${[1,2,3].map(n=>`<div class="field"><label>${ORDTXT(n)} place</label>
              <input class="inp" type="number" min="0" id="r${n}" value="${s.relay[n]||''}" placeholder="0"></div>`).join('')}
          </div></div>
        <div class="formsec"><span class="eyebrow">Manual house score adjustment</span>
          <p style="font-size:12px;color:var(--ink-2);line-height:1.5;margin:0 0 10px">Choose a house and enter a non-negative number of points. Add or deduct applies to its current total. Automatic points from published results remain active and continue adding normally.</p>
          <div class="grid2">
            <div class="field"><label for="adjHouse">House</label>
              <select class="inp" id="adjHouse">${HOUSE_KEYS.map(h=>`<option value="${h}">${h}</option>`).join('')}</select></div>
            <div class="field"><label for="adjAmount">Points (0 or more)</label>
              <input class="inp" type="number" min="0" step="1" inputmode="numeric" id="adjAmount" value="0" placeholder="Enter points"></div>
          </div>
          <div class="grid2" style="margin-top:10px">
            <button class="btn btn-primary" type="button" id="adjAdd">＋ Add points</button>
            <button class="btn" type="button" id="adjDeduct">− Deduct points</button>
          </div>
          <div id="adjPreview" style="margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--ink-2)">Current total: loading…</div>
        </div>
        <div class="formsec"><span class="eyebrow">Meet title shown on screen</span>
          <input class="inp" id="mTitle" value="${esc(Store.state.meetTitle||'')}" placeholder="Annual Athletic Meet"></div>
      </div>
      <div class="mfoot"><div class="spacer"></div>
        <button class="btn" data-x="close">Cancel</button>
        <button class="btn btn-primary" data-x="save">Save scoring</button></div>`);
    const currentHouseTotal = house => Store.standings().find(row=>row.house===house)?.pts || 0;
    const updateAdjustmentPreview = () => {
      const house=$('#adjHouse',m).value;
      $('#adjPreview',m).textContent=`${house} current total: ${currentHouseTotal(house)} points`;
    };
    $('#adjHouse',m).addEventListener('change',updateAdjustmentPreview);
    const applyHouseAdjustment = mode => {
      const house=$('#adjHouse',m).value;
      const raw=$('#adjAmount',m).value.trim();
      if(raw===''){ toast('Enter a points amount first.','warn'); return; }
      const amount=Number(raw);
      if(!Number.isFinite(amount)||amount<0||!Number.isInteger(amount)){
        toast('Enter a whole number of 0 or more.','warn'); return;
      }
      if(amount===0){ toast('Enter an amount greater than zero.','warn'); return; }
      const current=currentHouseTotal(house);
      const next=mode==='add' ? current+amount : Math.max(0,current-amount);
      const applied=mode==='add' ? amount : current-next;
      const autoPoints=Store.state.results.reduce((sum,r)=>sum+(r.places||[]).reduce((subtotal,p)=>subtotal+(p.house===house?(Number(p.points)||0):0),0),0);
      s.houseScoreBases=s.houseScoreBases||{};
      s.houseScoreBases[house]={autoAt:autoPoints,scoreAt:next};
      Store.state.scoring.houseScoreBases=s.houseScoreBases;
      Store.save();
      updateAdjustmentPreview();
      if(mode==='add') toast(`${house}: added ${applied} points. New total: ${next}.`,'ok');
      else if(applied>0) toast(`${house}: deducted ${applied} points. New total: ${next}.`,'ok');
      else toast(`${house} is already at 0 points. No points deducted.`,'warn');
    };
    $('#adjAdd',m).addEventListener('click',()=>applyHouseAdjustment('add'));
    $('#adjDeduct',m).addEventListener('click',()=>applyHouseAdjustment('deduct'));
    updateAdjustmentPreview();
    $$('[data-x]',m).forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.x==="save"){
        [1,2,3].forEach(n=>{ s.individual[n]=Number($('#i'+n).value)||0; s.relay[n]=Number($('#r'+n).value)||0; });
        s.configured = [1,2,3].some(n=>s.individual[n]>0||s.relay[n]>0);
        Store.state.scoring=s; Store.state.meetTitle=$('#mTitle').value.trim()||MEET.title; Store.save();
        Modal.close(); Dashboard.render(); toast(s.configured?"Scoring saved.":"Scoring cleared.","ok");
      } else Modal.close();
    }));
  }
};

/* ============================================================
   8. PHOTO UPLOADER  (carried over from v1 — working, untouched logic)
   ============================================================ */
const MAXDIM=1500, MAXBYTES=20*1024*1024;
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image();
  i.onload=()=>res(i); i.onerror=()=>rej(new Error("That image could not be read. Try a JPG or PNG.")); i.src=src; }); }
async function processFile(file){
  if(!file) throw new Error("No file selected.");
  if(!/^image\//.test(file.type)) throw new Error("Only image files can be used for winner photos.");
  if(file.size>MAXBYTES) throw new Error("That image is over 20 MB. Please choose a smaller photo.");
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImage(url);
    const s=Math.min(1, MAXDIM/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return { src:c.toDataURL('image/jpeg',.86), ox:0, oy:0, zoom:1 };
  } finally { URL.revokeObjectURL(url); }
}
function Uploader(host, photos, max){
  function paint(){
    host.innerHTML=`<div class="relaygrid">
      ${photos.map((p,i)=>`<div class="drop has" data-i="${i}" title="Adjust, replace or remove"><img></div>`).join('')}
      ${photos.length<max?`<div class="drop" data-add="1"><span class="plus">＋</span>${max>1?'Add':'Photo'}</div>`:''}</div>`;
    $$('.drop.has img',host).forEach((im,i)=>applyPhoto(im,photos[i]));
    bind();
  }
  function addFiles(list){
    const files=[...list].slice(0,max-photos.length);
    if(!files.length){ toast(`Maximum ${max} photo${max>1?'s':''} here.`,"warn"); return; }
    files.forEach(f=>{
      const slot=document.createElement('div'); slot.className="drop"; slot.innerHTML='<div class="busy"><div class="spin"></div></div>';
      $('.relaygrid',host).appendChild(slot);
      processFile(f).then(p=>{ photos.push(p); paint(); })
        .catch(e=>{ slot.remove(); toast(e.message,"err",4500); });
    });
  }
  function editor(i){
    $$('.editpop',host).forEach(e=>e.remove());
    const p=photos[i], pop=document.createElement('div'); pop.className="editpop";
    pop.innerHTML=`<div class="eyebrow" style="margin-bottom:9px">Position &amp; zoom</div>
      <div class="stagebox"><img></div>
      <input type="range" min="1" max="2.4" step="0.02" value="${p.zoom}">
      <div class="miniact"><button class="btn" data-act="rep">Replace</button>
        <button class="btn" data-act="rem">Remove</button><button class="btn btn-primary" data-act="ok">Done</button></div>`;
    host.appendChild(pop);
    const box=$('.stagebox',pop), im=$('img',box); applyPhoto(im,p);
    let drag=null;
    box.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,ox:p.ox,oy:p.oy};
      box.setPointerCapture(e.pointerId); box.classList.add('drag'); });
    box.addEventListener('pointermove',e=>{ if(!drag) return; const r=box.getBoundingClientRect();
      p.ox=Math.max(-60,Math.min(60,drag.ox+(e.clientX-drag.x)/r.width*100));
      p.oy=Math.max(-60,Math.min(60,drag.oy+(e.clientY-drag.y)/r.height*100)); applyPhoto(im,p); });
    ['pointerup','pointercancel'].forEach(ev=>box.addEventListener(ev,()=>{drag=null;box.classList.remove('drag');}));
    $('input',pop).addEventListener('input',e=>{ p.zoom=+e.target.value; applyPhoto(im,p); });
    $$('button',pop).forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.act;
      if(a==='rem'){ photos.splice(i,1); pop.remove(); paint(); }
      else if(a==='rep'){ pop.remove(); pick(i); }
      else { pop.remove(); paint(); }
    }));
    setTimeout(()=>document.addEventListener('pointerdown',function off(e){
      if(!pop.contains(e.target)){ pop.remove(); paint(); document.removeEventListener('pointerdown',off); } }),0);
  }
  function pick(replaceIdx){
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    if(replaceIdx==null&&max>1) inp.multiple=true;
    inp.onchange=()=>{ if(replaceIdx!=null){ const f=inp.files[0]; if(!f) return;
        processFile(f).then(p=>{ photos.splice(replaceIdx,1,p); paint(); }).catch(e=>toast(e.message,"err",4500)); }
      else addFiles(inp.files); };
    inp.click();
  }
  function bind(){
    $$('.drop',host).forEach(d=>{
      if(d.dataset.add) d.addEventListener('click',()=>pick(null));
      else d.addEventListener('click',()=>editor(+d.dataset.i));
      d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over');});
      d.addEventListener('dragleave',()=>d.classList.remove('over'));
      d.addEventListener('drop',e=>{ e.preventDefault(); d.classList.remove('over');
        if(d.dataset.add) addFiles(e.dataTransfer.files);
        else { const f=e.dataTransfer.files[0]; if(f) processFile(f).then(p=>{photos.splice(+d.dataset.i,1,p);paint();}).catch(er=>toast(er.message,"err",4500)); } });
    });
  }
  paint();
}

/* ============================================================
   9. RESULT ENTRY — always tied to one competition
   ============================================================ */
const ResultEntry = {
  open(compId){
    const c=Store.comp(compId); if(!c){ toast("That competition no longer exists.","err"); return; }
    const existing=c.resultId?Store.result(c.resultId):null;
    this.compId=compId; this.confirming=false;
    const relay=isRelay(Comp.title(c));
    this.places=[1,2,3].map(n=>{
      const p=existing&&existing.places.find(x=>x.position===n);
      return { position:n, studentName:p?p.studentName:"", house:p?p.house:"", perf:p?p.perf:"",
               points:p?p.points:Store.pointsFor(n,relay), photos:p&&p.photos?p.photos.map(o=>({...o})):[] };
    });
    this.paint();
  },
  paint(){
    const c=Store.comp(this.compId), relay=isRelay(Comp.title(c)), maxPhotos=relay?4:1, a=Store.arena(c.arenaId);
    const m=Modal.open(`
      <div class="mhead"><div><span class="eyebrow">${a.name} · ${STATUS_LABEL[c.status]}</span>
        <h3 style="margin-top:7px">${esc(c.category)} ${esc(c.gender)} — ${esc(Comp.title(c))}</h3></div>
        <div class="spacer"></div><button class="btn btn-icon" data-x="close">✕</button></div>
      <div class="mbody">
        ${Store.state.scoring.configured?'':`<p style="font-size:12px;color:var(--ink-3);margin:0 0 12px">Points are not configured yet — enter them here, or set them once under <b>Points</b>.</p>`}
        ${this.places.map(p=>`
          <div class="entry e${p.position}" data-p="${p.position}">
            <div class="posbadge">${ORDTXT(p.position).toUpperCase()}</div>
            <div class="field"><label>${relay?'Team / athletes':'Student name'}</label>
              <input class="inp fName" value="${esc(p.studentName)}" placeholder="${relay?'e.g. Falcon relay team':'Full name'}"></div>
            <div class="field"><label>House</label>
              <select class="inp fHouse"><option value="">Select</option>
                ${HOUSE_KEYS.map(h=>`<option ${h===p.house?'selected':''}>${h}</option>`).join('')}</select></div>
            <div class="field"><label>${perfLabel(Comp.title(c))}</label>
              <input class="inp fPerf" value="${esc(p.perf)}" placeholder="${perfHint(Comp.title(c))}"></div>
            <div class="field"><label>Points</label>
              <input class="inp fPts" type="number" min="0" value="${p.points||''}" placeholder="0"></div>
            <div class="field"><label>Photo</label><div class="uploader" data-up="${p.position}"></div></div>
          </div>`).join('')}
      </div>
      <div class="mfoot">
        <span class="hint" style="font-size:11px;color:var(--ink-3)">Publishing runs the 60-second ceremony. Other live competitions keep running.</span>
        <div class="spacer"></div>
        <button class="btn" data-x="close">Cancel</button>
        <button class="btn" data-x="preview">${ICON.play}Preview</button>
        <button class="btn btn-gold" data-x="publish">${ICON.medal}${this.confirming?'Confirm — replace result':'Publish result'}</button>
      </div>`);
    this.places.forEach(p=>Uploader($(`[data-up="${p.position}"]`,m), p.photos, maxPhotos));
    const sync=()=>{ $$('.entry',m).forEach((row,i)=>{ const p=this.places[i];
      p.studentName=$('.fName',row).value.trim(); p.house=$('.fHouse',row).value;
      p.perf=$('.fPerf',row).value.trim(); p.points=Number($('.fPts',row).value)||0; }); };
    $$('.fName,.fHouse,.fPerf,.fPts',m).forEach(i=>i.addEventListener('change',()=>{ sync(); this.confirming=false; }));
    $$('[data-x]',m).forEach(b=>b.addEventListener('click',()=>{
      const act=b.dataset.x;
      if(act==="close") return Modal.close();
      sync(); const r=this.build(); if(!this.validate(r)) return;
      if(act==="preview"){ Modal.close();
        VictoryMoment.play(r,{preview:true,
          onBack:()=>{ VictoryMoment.close(true); this.paint(); },
          onPublish:()=>{ VictoryMoment.close(true); this.commit(r); }});
        return; }
      if(Store.comp(this.compId).resultId && !this.confirming){
        this.confirming=true; this.paint();
        toast("This competition already has a published result. Press again to replace it.","warn",5000); return; }
      Modal.close(); this.commit(r);
    }));
  },
  build(){
    const c=Store.comp(this.compId);
    return { id:"r"+Date.now().toString(36), compId:c.id, arenaId:c.arenaId, type:c.type,
      category:c.category, gender:c.gender, event:Comp.title(c), timestamp:Date.now(),
      places:this.places.filter(p=>p.studentName).map(p=>({...p, photos:p.photos.map(x=>({...x}))})) };
  },
  validate(r){
    if(!r.places.some(p=>p.position===1)){ toast("Enter the first-place athlete before publishing.","err"); return false; }
    const noHouse=r.places.filter(p=>!p.house);
    if(noHouse.length){ toast(`Select a house for ${noHouse.map(p=>ORDTXT(p.position)).join(', ')} place.`,"err"); return false; }
    return true;
  },
  commit(r){
    const c=Store.comp(this.compId);
    Store.publishResult(r,c); Dashboard.render();
    VictoryMoment.play(r,{}); toast("Result published.","ok");
  }
};

/* ============================================================
   10. VICTORY MOMENT — 60 seconds enforced by the real clock
   ============================================================ */
const MIN_SECONDS = 60;
const VictoryMoment = {
  st:null,
  play(result, opts={}){
    if(!result){ toast("No result to show yet.","warn"); return; }
    const hero=result.places.find(p=>p.position===1&&p.studentName)||result.places[0];
    if(!hero){ toast("No winner recorded for that competition.","warn"); return; }
    if(this.st) this.close(true);
    const photos=hero.photos||[], tone=hero.position===1?'gold':hero.position===2?'silver':'bronze';
    const relay=isRelay(result.event);
    const startedAt = opts.resumeFrom || Date.now();
    const elapsed = (Date.now()-startedAt)/1000;
    const skipIntro = elapsed>16 || opts.preview;

    $('#vmRoot').innerHTML=`
      <div class="vm ${tone} ${opts.preview?'preview':''} ${skipIntro&&!opts.preview?'skip-intro':''}" id="vm" ${skipIntro&&!opts.preview?'style="--d-top:0s;--d-pos:.1s;--d-name:.2s;--d-sub:.3s;--d-photo:.1s;--d-run:.4s"':''}>
        <div class="vm-top">
          <div class="crest"><img src="${LOGO}" alt=""></div>
          <div><div class="vm-meet">${esc(MEET.school)} · ${esc(Store.state.meetTitle||MEET.title)}</div>
            <div class="vm-eventline">${esc(result.category)} ${esc(result.gender)} — <b>${esc(result.event)}</b></div></div>
          <div class="spacer"></div>
          <div class="vm-stamp"><div class="vm-meet">Result declared</div>
            <div class="vm-eventline" style="font-size:17px">${fmtClock(result.timestamp)}</div></div>
        </div>
        <div class="vm-stage equal-results">
          <div class="vm-results-grid">
            ${result.places.filter(p=>p.studentName).sort((a,b)=>a.position-b.position).map(p=>`
              <article class="vm-result-card place-${p.position}" style="--reveal-delay:${1.4+(p.position-1)*2.6}s">
                <div class="vm-result-place">${ORD(p.position)} <span style="font-size:.45em;letter-spacing:.18em">PLACE</span></div>
                <div class="vm-result-photo">${p.photos&&p.photos[0]?`<img src="${p.photos[0].src}" alt="${esc(p.studentName)}">`:`<div class="nophoto">PHOTOGRAPH<br>NOT UPLOADED</div>`}</div>
                <div class="vm-result-name">${esc(p.studentName)}</div>
                <div class="vm-result-meta"><span class="house-badge">${houseDot(p.house,12)}${esc(p.house||'—')} House</span><span class="medal-chip">${ICON.medal}${MEDAL(p.position)} Medal</span></div>
                ${p.perf?`<div class="vm-perf">${perfLabel(result.event)} · ${esc(p.perf)}</div>`:''}
              </article>`).join('')}
          </div>
        </div>
        <div class="vm-foot">
          <div class="spacer"></div>
          <div class="vm-timer" style="position:relative">
            ${this.liveNote()}
            ${opts.preview?'':`<div class="vm-progress"><i id="vmBar"></i></div><div class="vm-count" id="vmCount"></div>`}
            <div class="vm-ctl">
              ${opts.preview?`<button class="btn" id="vmBack">Back to edit</button>
                              <button class="btn btn-gold" id="vmPub">${ICON.medal}Publish now</button>`
                            :`<button class="btn" id="vmExt">+30s</button>
                              <button class="btn" id="vmHold">Hold</button>
                              <button class="btn btn-primary" id="vmExit">Locked</button>`}
            </div>
          </div>
        </div>
      </div>
      ${opts.preview?`<span class="pill preview-tag">Preview — not published</span>`:''}`;

    const vm=$('#vm');
    if(photos.length) $$('.frame img',vm).forEach((im,i)=>applyPhoto(im,photos[i]));
    if(opts.preview){
      vm.classList.add('emphasis');
      $('#vmBack').addEventListener('click',()=>opts.onBack&&opts.onBack());
      $('#vmPub').addEventListener('click',()=>opts.onPublish&&opts.onPublish());
      this.st={preview:true}; return;
    }

    this.st={ startedAt, holdUntil:opts.holdUntil||MIN_SECONDS, held:!!opts.held, replay:!!opts.replay };
    if(!opts.replay){ Store.state.vm={resultId:result.id, startedAt, holdUntil:this.st.holdUntil, held:this.st.held}; Store.save(); }
    if(elapsed>=40) vm.classList.add('emphasis');
    if(elapsed>=55) vm.classList.add('outro');
    $('#vmExt').addEventListener('click',()=>{ this.st.holdUntil+=30; vm.classList.remove('outro'); this.persist();
      toast("Ceremony extended by 30 seconds.","ok",2200); });
    $('#vmHold').addEventListener('click',e=>{ this.st.held=!this.st.held; this.persist();
      e.currentTarget.classList.toggle('btn-primary',this.st.held);
      e.currentTarget.textContent=this.st.held?'Held':'Hold'; });
    $('#vmExit').addEventListener('click',e=>{ if(!e.currentTarget.disabled) this.close(); });
    this.tick();
  },
  liveNote(){
    const live=Store.comps().filter(c=>Comp.isActive(c));
    if(!live.length) return '';
    return `<span class="pill vm-live-note">${live.map(c=>
      `<span class="dot live-dot"></span>${esc(Store.arena(c.arenaId).name)} · ${esc(Comp.title(c))} <span data-elapsed="${c.id}">${fmtDur(Comp.elapsed(c))}</span>`
    ).join(' &nbsp;·&nbsp; ')}</span>`;
  },
  persist(){
    if(!this.st||this.st.preview||this.st.replay) return;
    Store.state.vm={...Store.state.vm, holdUntil:this.st.holdUntil, held:this.st.held}; Store.save();
  },
  tick(){
    const s=this.st; if(!s||s.preview) return;
    const vm=$('#vm'); if(!vm) return;
    const el=(Date.now()-s.startedAt)/1000;
    const bar=$('#vmBar'), count=$('#vmCount'), exit=$('#vmExit');
    if(bar) bar.style.width=Math.min(100,el/MIN_SECONDS*100)+'%';
    if(el>=40) vm.classList.add('emphasis');
    if(el>=s.holdUntil-5 && !s.held) vm.classList.add('outro');
    if(exit){
      const unlocked = el>=MIN_SECONDS || s.replay;
      exit.disabled=!unlocked;
      exit.textContent = unlocked ? "Return to dashboard" : `Locked ${Math.ceil(MIN_SECONDS-el)}s`;
    }
    if(count){ const left=Math.ceil(s.holdUntil-el); count.textContent = s.held?'HOLD':(left>0&&left<=15?left+'s':''); }
    if(!s.held && el>=s.holdUntil) this.close();
  },
  close(instant){
    if(!this.st) return;
    this.st=null;
    if(Store.state.vm){ Store.state.vm=null; Store.save(); }
    const vm=$('#vm');
    if(!vm||instant){ $('#vmRoot').innerHTML=""; return; }
    vm.classList.add('closing');
    setTimeout(()=>{ $('#vmRoot').innerHTML=""; Dashboard.render(); },980);
  },
  resume(){
    const v=Store.state.vm; if(!v) return;
    const r=Store.result(v.resultId);
    if(!r){ Store.state.vm=null; Store.save(); return; }
    if((Date.now()-v.startedAt)/1000 >= (v.holdUntil||MIN_SECONDS) && !v.held){ Store.state.vm=null; Store.save(); return; }
    this.play(r,{resumeFrom:v.startedAt, holdUntil:v.holdUntil, held:v.held});
  }
};
